<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zugangscode · stube.li</title>
  <link rel="icon" type="image/svg+xml" href="/assets/stube-li-logo.svg" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="/assets/favicon-32x32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;family=IBM+Plex+Mono:wght@600&amp;display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      background: #fafafa;
      color: #000;
    }
    .card {
      width: 100%;
      max-width: 560px;
      background: #fff;
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 12px;
      padding: 32px 28px 28px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.08);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 28px;
      text-decoration: none;
      color: inherit;
    }
    .brand img { height: 28px; width: auto; display: block; }
    .brand span { font-size: 15px; font-weight: 600; letter-spacing: -0.02em; }
    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #163326;
    }
    .lead {
      margin: 0 0 22px;
      font-size: 14px;
      line-height: 1.45;
      color: #666;
    }
    .code-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 8px;
      background: #fafafa;
      margin-bottom: 14px;
    }
    .code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.12em;
      font-variant-numeric: tabular-nums;
      color: #163326;
    }
    .copy {
      appearance: none;
      border: 0;
      min-height: 40px;
      padding: 0 16px;
      border-radius: 8px;
      background: #2d5f4f;
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .copy:hover { filter: brightness(1.08); }
    .copy.is-done { background: #163326; cursor: default; }
    .status {
      margin: 0;
      font-size: 13px;
      color: #666;
      min-height: 1.3em;
    }

    .hint {
      display: none;
      margin-top: 20px;
    }
    .hint.is-on {
      display: block;
      animation: riseIn 0.45s ease-out;
    }
    .hint-caption {
      margin: 12px 0 0;
      font-size: 14px;
      line-height: 1.45;
      color: #163326;
      font-weight: 600;
    }
    .hint-caption span { color: #2d5f4f; }

    .scene {
      background: linear-gradient(165deg, #8fb3ce 0%, #c9b8ae 48%, #edcbb8 100%);
      border-radius: 14px;
      padding: 22px 18px 16px;
    }
    .browser {
      background: #f4f4f5;
      border-radius: 12px;
      box-shadow: 0 18px 40px rgba(20, 30, 40, 0.18);
      overflow: visible;
    }
    .chrome {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 14px 8px;
    }
    .chrome i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #d4d4d8;
      display: block;
    }
    .chrome i:nth-child(1) { background: #ff5f57; }
    .chrome i:nth-child(2) { background: #febc2e; }
    .chrome i:nth-child(3) { background: #28c840; }

    .page {
      background: #fff;
      border-radius: 0 0 12px 12px;
      overflow: visible;
    }
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px 44px;
      border-bottom: 1px solid #ececee;
    }
    .page-brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .page-brand img { height: 22px; width: auto; display: block; }
    .page-brand-text {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: #163326;
    }
    .page-brand-text .dot { color: #2d5f4f; }

    .target {
      position: relative;
      flex-shrink: 0;
      z-index: 2;
    }
    .login {
      position: relative;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 12px;
      border-radius: 999px;
      background: #fff;
      border: 2.5px solid #1a1a1a;
      box-shadow: 0 0 0 0 rgba(26, 26, 26, 0.18);
      font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #111;
      animation: targetPulse 1.6s ease-in-out infinite;
    }
    .you {
      position: absolute;
      top: calc(100% + 10px);
      right: 2px;
      display: flex;
      align-items: flex-start;
      gap: 6px;
      z-index: 3;
      animation: youPop 0.55s 0.15s cubic-bezier(0.2, 1.2, 0.3, 1) both;
    }
    .you-caret {
      width: 0;
      height: 0;
      margin-top: -10px;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-bottom: 8px solid #6b7280;
      filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.08));
    }
    .you-label {
      background: #6b7280;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.01em;
      padding: 3px 10px 4px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
      animation: youBob 1.4s 0.7s ease-in-out infinite;
    }

    .ghost {
      padding: 22px 20px 20px;
      display: flex;
      justify-content: center;
    }
    .ghost-card {
      width: 70%;
      max-width: 280px;
      border: 1px solid #ececee;
      border-radius: 10px;
      padding: 16px;
      background: #fff;
    }
    .ghost-kicker {
      width: 42%;
      height: 6px;
      border-radius: 99px;
      background: #e8e8ea;
      margin-bottom: 12px;
    }
    .ghost-title {
      width: 78%;
      height: 10px;
      border-radius: 99px;
      background: #e4e4e7;
      margin-bottom: 8px;
    }
    .ghost-line {
      height: 6px;
      border-radius: 99px;
      background: #f0f0f2;
      margin-bottom: 6px;
    }
    .ghost-line.short { width: 62%; }
    .ghost-row {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }
    .ghost-input {
      flex: 1;
      height: 22px;
      border-radius: 6px;
      background: #f4f4f5;
    }
    .ghost-btn {
      width: 72px;
      height: 22px;
      border-radius: 6px;
      background: #d7e3dd;
    }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes targetPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(26, 26, 26, 0.18); transform: scale(1); }
      50% { box-shadow: 0 0 0 7px rgba(26, 26, 26, 0); transform: scale(1.03); }
    }
    @keyframes youPop {
      from { opacity: 0; transform: translateY(8px) scale(0.7); }
      to { opacity: 1; transform: none; }
    }
    @keyframes youBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .hint.is-on, .login, .you, .you-label { animation: none; }
      .hint.is-on, .you { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <main class="card">
    <a class="brand" href="/">
      <img src="/assets/stube-li-logo.svg" alt="" />
      <span>stube.li</span>
    </a>
    <h1>Zugangscode</h1>
    <p class="lead">Kopiere den Code. Danach zeigen wir dir, wo du ihn auf stube.li eingibst.</p>
    <div class="code-box">
      <span class="code" id="code">02111965</span>
      <button class="copy" type="button" id="copy">Kopieren</button>
    </div>
    <p class="status" id="status">Zuerst den Code kopieren.</p>

    <div class="hint" id="hint">
      <div class="scene" aria-hidden="true">
        <div class="browser">
          <div class="chrome"><i></i><i></i><i></i></div>
          <div class="page">
            <div class="page-header">
              <div class="page-brand">
                <img src="/assets/stube-li-logo.svg" alt="" />
                <span class="page-brand-text">stube<span class="dot">.</span></span>
              </div>
              <div class="target">
                <div class="login">
                  <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z" />
                    <circle cx="16.5" cy="7.5" r=".5" fill="currentColor" />
                  </svg>
                  Login mit Passwort
                </div>
                <div class="you">
                  <span class="you-caret"></span>
                  <span class="you-label">You</span>
                </div>
              </div>
            </div>
            <div class="ghost">
              <div class="ghost-card">
                <div class="ghost-kicker"></div>
                <div class="ghost-title"></div>
                <div class="ghost-line"></div>
                <div class="ghost-line short"></div>
                <div class="ghost-row">
                  <div class="ghost-input"></div>
                  <div class="ghost-btn"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <p class="hint-caption">Oben rechts auf stube.li: <span>Login mit Passwort</span></p>
    </div>
  </main>
  <script>
    const CODE = "02111965";
    const DEST = "https://www.stube.li/";
    const DELAY = 7;
    const preview = new URLSearchParams(location.search).has("preview");
    const copyBtn = document.getElementById("copy");
    const statusEl = document.getElementById("status");
    const hintEl = document.getElementById("hint");
    let remaining = DELAY;
    let timer;

    async function copyCode() {
      try {
        await navigator.clipboard.writeText(CODE);
        return true;
      } catch {
        try {
          const field = document.createElement("textarea");
          field.value = CODE;
          field.setAttribute("readonly", "");
          field.style.position = "fixed";
          field.style.left = "-9999px";
          document.body.appendChild(field);
          field.select();
          const ok = document.execCommand("copy");
          field.remove();
          return ok;
        } catch {
          return false;
        }
      }
    }

    function go() {
      window.location.href = DEST;
    }

    function showHint() {
      copyBtn.textContent = "Kopiert";
      copyBtn.classList.add("is-done");
      hintEl.classList.add("is-on");
    }

    function startCountdown() {
      remaining = DELAY;
      statusEl.innerHTML = "Weiter zu stube.li in <span id=\"secs\">" + remaining + "</span>s…";
      const secsEl = document.getElementById("secs");
      timer = setInterval(() => {
        remaining -= 1;
        if (remaining <= 0) {
          clearInterval(timer);
          go();
          return;
        }
        secsEl.textContent = String(remaining);
      }, 1000);
    }

    copyBtn.addEventListener("click", async () => {
      if (copyBtn.classList.contains("is-done")) return;
      const ok = await copyCode();
      if (!ok) {
        statusEl.textContent = "Kopieren hat nicht geklappt. Bitte nochmals versuchen.";
        return;
      }
      showHint();
      startCountdown();
    });

    if (preview) {
      showHint();
      statusEl.textContent = "Vorschau der Animation — kein Redirect.";
    }
  </script>
</body>
</html>
